<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your GemNest account and continue your creative journey.">
    <title>GemNest</title>
    <link rel="icon" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="gem-auth-page">
    <div class="gem-auth-shell">
        <header class="gem-auth-toolbar" aria-label="Display preferences">
            <button class="gem-auth-preference" type="button" data-gem-auth-theme aria-label="Toggle dark mode">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>
            <button class="gem-auth-preference" type="button" data-gem-auth-rtl aria-label="Toggle RTL mode">
                <i class="fa-solid fa-right-left" aria-hidden="true"></i>
            </button>
        </header>

        <main class="gem-auth-main">
            <section class="gem-auth-card" aria-labelledby="gem-auth-title">
                <a class="gem-auth-logo" href="index.html" aria-label="GemNest home">
                    <img src="images/logo.png" alt="GemNest">
                </a>
                <h1 id="gem-auth-title">Welcome to GemNest.</h1>
                <p class="gem-auth-description">Sign in to continue your creative journey with us.</p>

                <form class="gem-auth-form" id="gem-auth-form" novalidate>
                    <label class="gem-auth-label" for="gem-auth-email">Email Address</label>
                    <div class="gem-auth-field">
                        <i class="gem-auth-field-icon fa-regular fa-envelope" aria-hidden="true"></i>
                        <input id="gem-auth-email" name="email" type="email" placeholder="Enter your email address"
                            autocomplete="email" required>
                    </div>

                    <label class="gem-auth-label" for="gem-auth-password">Password</label>
                    <div class="gem-auth-field">
                        <i class="gem-auth-field-icon fa-solid fa-lock" aria-hidden="true"></i>
                        <input id="gem-auth-password" name="password" type="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button class="gem-auth-eye" type="button" data-gem-auth-password="gem-auth-password"
                            aria-label="Show password" aria-pressed="false">
                            <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="gem-auth-options">
                        <label class="gem-auth-check"><input type="checkbox" name="remember"><span>Remember
                                Me</span></label>
                        <a class="gem-auth-inline-link" href="#forgot-password" data-gem-auth-forgot>Forgot
                            Password?</a>
                    </div>

                    <button class="gem-auth-submit" type="submit">Login <i class="fa-solid fa-arrow-right"
                            aria-hidden="true"></i></button>
                    <p class="gem-auth-feedback" id="gem-auth-feedback" role="status" aria-live="polite"></p>
                </form>

                <div class="gem-auth-divider"><span>OR CONTINUE WITH</span></div>
                <div class="gem-auth-socials" aria-label="Social sign-in options">
                    <button class="gem-auth-social" type="button" data-gem-auth-social="Facebook"
                        aria-label="Continue with Facebook"><i class="fa-brands fa-facebook-f gem-auth-facebook"
                            aria-hidden="true"></i><span>Facebook</span></button>
                    <button class="gem-auth-social" type="button" data-gem-auth-social="Apple"
                        aria-label="Continue with Apple"><i class="fa-brands fa-apple gem-auth-apple"
                            aria-hidden="true"></i><span>Apple</span></button>
                    <button class="gem-auth-social" type="button" data-gem-auth-social="Google"
                        aria-label="Continue with Google"><img src="images/google-logo.svg"
                            alt=""><span>Google</span></button>
                </div>

                <p class="gem-auth-switch">Don't have an account? <a href="register.html">Create an Account</a></p>

            </section>
        </main>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
